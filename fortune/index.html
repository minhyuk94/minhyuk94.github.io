<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>오늘의 운세</title>
<meta name="description" content="생년월일로 보는 오늘의 운세와 띠별 운세. 날마다 바뀌어요." />
<meta property="og:type" content="website" />
<meta property="og:title" content="오늘의 운세" />
<meta property="og:description" content="생년월일로 보는 오늘의 운세와 띠별 운세. 날마다 바뀌어요." />
<meta property="og:url" content="https://minhyuk94.github.io/" />
<meta name="theme-color" content="#14122b" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%2314122b'/%3E%3Cpath d='M40 14a20 20 0 1 0 10 30A16 16 0 1 1 40 14z' fill='%23f4d27a'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<style>
  :root {
    --night: #14122b; --night2: #221d45; --paper: #fbf6ea; --ink: #2b2620; --muted: #7b7163;
    --gold: #e9c46a; --red: #c8553d; --line: #e6dcc6;
    --serif: 'Gowun Batang', 'Nanum Myeongjo', serif; --sans: 'Pretendard Variable', Pretendard, system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family: var(--sans); color: var(--ink); background: radial-gradient(1200px 600px at 70% -10%, #3a2f6b 0%, transparent 60%), linear-gradient(180deg, var(--night) 0%, var(--night2) 55%, #2d2450 100%); min-height: 100vh; }
  .sky { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .wrap { position: relative; z-index: 1; max-width: 880px; margin: 0 auto; padding: 40px 20px 60px; }
  header { text-align: center; color: #f3ecdc; margin-bottom: 26px; }
  .moon { width: 64px; height: 64px; margin: 0 auto 10px; display: block; filter: drop-shadow(0 0 18px rgba(244, 210, 122, 0.55)); }
  h1 { font-family: var(--serif); font-size: clamp(34px, 6vw, 48px); margin: 0; letter-spacing: 0.06em; }
  .date { margin-top: 14px; display: inline-flex; align-items: center; gap: 10px; }
  .date strong { font-family: var(--serif); font-size: 18px; min-width: 190px; }
  .date button { border: 1px solid rgba(243, 236, 220, 0.35); background: transparent; color: #f3ecdc; border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer; }
  .date button:hover { background: rgba(255, 255, 255, 0.08); }
  .date button.today { border-color: var(--gold); color: var(--gold); }

  .card { background: var(--paper); border-radius: 18px; box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35); padding: 28px; position: relative; overflow: hidden; }
  .card::before { content: ''; position: absolute; inset: 10px; border: 1px solid var(--line); border-radius: 12px; pointer-events: none; }
  .card h2 { font-family: var(--serif); font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 18px; }

  form.birth { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  form.birth label { font-weight: 600; }
  form.birth input { font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; min-width: 170px; }
  .btn { font: inherit; font-weight: 700; border: 0; border-radius: 10px; padding: 11px 18px; cursor: pointer; background: var(--ink); color: #fff; }
  .btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); font-weight: 600; }
  .note { font-size: 12px; color: var(--muted); margin: 10px 0 0; }

  .result { display: none; margin-top: 22px; }
  .result.on { display: block; animation: rise 0.5s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .who { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
  .chip { background: #f1e8d3; border-radius: 999px; padding: 6px 12px; font-size: 14px; }
  .top { display: grid; grid-template-columns: 150px 1fr; gap: 22px; align-items: center; }
  .ring { width: 150px; height: 150px; position: relative; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring .num { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; font-family: var(--serif); }
  .ring .num b { font-size: 40px; line-height: 1; }
  .ring .num span { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .stars { color: var(--red); letter-spacing: 3px; font-size: 18px; }
  .total { font-family: var(--serif); font-size: 19px; line-height: 1.6; margin: 6px 0 0; }
  .parts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-top: 24px; }
  .part { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .part .head { display: flex; justify-content: space-between; align-items: baseline; font-weight: 700; }
  .bar { height: 6px; background: #efe6d2; border-radius: 99px; margin: 8px 0 10px; overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--gold), var(--red)); }
  .part p { margin: 0; font-size: 14px; line-height: 1.55; }
  .lucky { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-top: 20px; }
  .lucky div { text-align: center; background: #f6efde; border-radius: 12px; padding: 12px 6px; }
  .lucky small { display: block; color: var(--muted); font-size: 12px; margin-bottom: 6px; }
  .lucky b { font-size: 15px; }
  .swatch { display: inline-block; width: 14px; height: 14px; border-radius: 50%; vertical-align: -2px; margin-right: 5px; border: 1px solid rgba(0, 0, 0, 0.15); }
  .word { margin: 22px 0 0; text-align: center; font-family: var(--serif); font-size: 20px; padding: 18px; border-top: 1px dashed var(--line); }
  .word::before { content: '“'; color: var(--red); } .word::after { content: '”'; color: var(--red); }
  .actions { display: flex; gap: 10px; justify-content: center; margin-top: 6px; }

  .animals { margin-top: 28px; }
  .animals h2 { color: #f3ecdc; font-family: var(--serif); text-align: center; margin: 0 0 6px; }
  .animals .sub { color: #c9c0e6; text-align: center; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .a { background: rgba(251, 246, 234, 0.96); border-radius: 14px; padding: 14px; text-align: center; border: 2px solid transparent; }
  .a.mine { border-color: var(--gold); box-shadow: 0 0 0 4px rgba(233, 196, 106, 0.25); }
  .a .e { font-size: 30px; }
  .a .n { font-weight: 700; margin-top: 2px; }
  .a .s { color: var(--red); font-size: 13px; letter-spacing: 1px; }
  .a p { margin: 6px 0 0; font-size: 13px; line-height: 1.45; }
  .a small { display: block; color: var(--muted); font-size: 12px; margin-top: 6px; }
  footer { text-align: center; color: #b9b0d8; font-size: 13px; margin-top: 34px; line-height: 1.8; }
  footer a { color: #f3ecdc; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #111; color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 14px; opacity: 0; transition: opacity 0.2s; z-index: 5; }
  .toast.on { opacity: 0.95; }
  @media (max-width: 640px) {
    .wrap { padding-top: 28px; }
    .card { padding: 22px 18px; }
    .top { grid-template-columns: 1fr; justify-items: center; text-align: center; }
    .parts { grid-template-columns: 1fr; }
    .lucky { grid-template-columns: repeat(2, 1fr); }
    .lucky div:last-child { grid-column: span 2; }
    .grid { grid-template-columns: repeat(2, 1fr); }
    .date strong { min-width: 0; font-size: 16px; }
  }
</style>
</head>
<body>
<canvas class="sky" id="sky"></canvas>
<div class="wrap">
  <header>
    <svg class="moon" viewBox="0 0 64 64" aria-hidden="true"><defs><radialGradient id="mg" cx="40%" cy="35%"><stop offset="0" stop-color="#fff3c4" /><stop offset="1" stop-color="#e9c46a" /></radialGradient></defs><path d="M40 6a26 26 0 1 0 18 40A21 21 0 1 1 40 6z" fill="url(#mg)" /></svg>
    <h1>오늘의 운세</h1>
    <div class="date">
      <button id="prev" aria-label="어제">‹ 어제</button>
      <strong id="dateLabel"></strong>
      <button id="next" aria-label="내일">내일 ›</button>
    </div>
    <div style="margin-top: 8px"><button class="date-today" id="today" hidden style="border:1px solid #e9c46a;color:#e9c46a;background:transparent;border-radius:999px;padding:4px 12px;font:inherit;font-size:12px;cursor:pointer">오늘로</button></div>
  </header>

  <section class="card">
    <h2>내 운세 보기</h2>
    <p class="sub">생년월일을 넣으면 띠와 별자리, 오늘의 운세를 알려 드려요. 이 브라우저에만 저장돼요.</p>
    <form class="birth" id="form">
      <label for="birth">생년월일</label>
      <input id="birth" type="date" min="1900-01-01" max="2100-12-31" required />
      <button class="btn" type="submit">운세 보기</button>
      <button class="btn ghost" type="button" id="forget" hidden>지우기</button>
    </form>
    <div class="result" id="result">
      <div class="who" id="who"></div>
      <div class="top">
        <div class="ring">
          <svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="none" stroke="#efe6d2" stroke-width="10" /><circle id="arc" cx="60" cy="60" r="52" fill="none" stroke="url(#rg)" stroke-width="10" stroke-linecap="round" stroke-dasharray="326.7" stroke-dashoffset="326.7" style="transition: stroke-dashoffset 0.9s ease" /><defs><linearGradient id="rg"><stop offset="0" stop-color="#e9c46a" /><stop offset="1" stop-color="#c8553d" /></linearGradient></defs></svg>
          <div class="num"><b id="score">0</b><span>총운</span></div>
        </div>
        <div>
          <div class="stars" id="stars"></div>
          <p class="total" id="total"></p>
        </div>
      </div>
      <div class="parts" id="parts"></div>
      <div class="lucky" id="lucky"></div>
      <p class="word" id="word"></p>
      <div class="actions"><button class="btn ghost" id="share" type="button">결과 공유하기</button></div>
    </div>
  </section>

  <section class="animals">
    <h2>띠별 오늘의 운세</h2>
    <p class="sub">태어난 해의 띠를 찾아보세요</p>
    <div class="grid" id="grid"></div>
  </section>

  <footer>
    재미로 보는 운세예요. 좋은 말만 챙겨 가세요 🙂<br />
    띠는 양력 해로 셈해요. 1~2월 설 전에 태어났다면 앞 해의 띠일 수 있어요.<br />
    만든 사람: <a href="/resume/">유민혁 이력서 →</a>
  </footer>
</div>
<div class="toast" id="toast"></div>

<script type="module">
  import { fortune, animalsToday, animalOf, signOf, validBirth, ymd } from './fortune.js';

  const $ = (id) => document.getElementById(id);
  const KEY = 'fortune_birth';
  let offset = 0; // 오늘에서 며칠 떨어졌나 (어제 -1, 내일 +1)

  function day() { const d = new Date(); d.setDate(d.getDate() + offset); return d; }
  function label(d) {
    const w = '일월화수목금토'[d.getDay()];
    return `${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일 (${w})`;
  }
  function stars(n) { return '★'.repeat(n) + '☆'.repeat(5 - n); }
  function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]); }

  function getBirth() { try { return localStorage.getItem(KEY) || ''; } catch { return ''; } }
  function setBirth(v) { try { v ? localStorage.setItem(KEY, v) : localStorage.removeItem(KEY); } catch {} }

  function render() {
    const d = day(), date = ymd(d);
    $('dateLabel').textContent = label(d);
    $('prev').disabled = offset <= -1; $('next').disabled = offset >= 1;
    $('prev').style.opacity = offset <= -1 ? 0.35 : 1; $('next').style.opacity = offset >= 1 ? 0.35 : 1;
    $('today').hidden = offset === 0;
    const birth = getBirth();
    const mine = validBirth(birth) ? animalOf(+birth.slice(0, 4)).id : '';
    // 띠별
    $('grid').innerHTML = animalsToday(date).map((a) => `
      <div class="a ${a.id === mine ? 'mine' : ''}">
        <div class="e">${a.emoji}</div><div class="n">${a.name}</div>
        <div class="s">${stars(a.stars)}</div><p>${esc(a.text)}</p>
        <small>행운의 색 ${a.color} · 숫자 ${a.number}</small>
      </div>`).join('');
    // 내 운세
    if (!validBirth(birth)) { $('result').classList.remove('on'); $('forget').hidden = true; return; }
    $('birth').value = birth; $('forget').hidden = false;
    const f = fortune(birth, date);
    const y = +birth.slice(0, 4), m = +birth.slice(5, 7), dd = +birth.slice(8, 10);
    const an = animalOf(y), [sign, sym] = signOf(m, dd);
    $('who').innerHTML = `<span class="chip">${an.emoji} ${an.name}</span><span class="chip">${sym} ${sign}</span><span class="chip">${y}년 ${m}월 ${dd}일생</span>`;
    $('score').textContent = f.total;
    $('arc').style.strokeDashoffset = String(326.7 * (1 - f.total / 100));
    $('stars').textContent = stars(f.stars);
    $('total').textContent = f.text;
    $('parts').innerHTML = f.parts.map((p) => `
      <div class="part"><div class="head"><span>${p.icon} ${p.label}</span><span>${p.score}</span></div>
      <div class="bar"><i style="width:${p.score}%"></i></div><p>${esc(p.text)}</p></div>`).join('');
    $('lucky').innerHTML = `
      <div><small>행운의 색</small><b><span class="swatch" style="background:${f.color.hex}"></span>${f.color.name}</b></div>
      <div><small>행운의 숫자</small><b>${f.numbers.join(', ')}</b></div>
      <div><small>행운의 물건</small><b>${esc(f.item)}</b></div>
      <div><small>좋은 방향</small><b>${f.dir}</b></div>
      <div><small>좋은 때</small><b>${f.time}</b></div>`;
    $('word').textContent = f.word;
    const res = $('result');
    if (!res.classList.contains('on')) { res.classList.add('on'); }
  }

  $('form').addEventListener('submit', (e) => {
    e.preventDefault();
    const v = $('birth').value;
    if (!validBirth(v)) { toast('생년월일을 다시 확인해 주세요'); return; }
    setBirth(v); render();
    $('result').scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
  $('forget').addEventListener('click', () => { setBirth(''); $('birth').value = ''; render(); toast('저장한 생년월일을 지웠어요'); });
  $('prev').addEventListener('click', () => { offset = Math.max(-1, offset - 1); render(); });
  $('next').addEventListener('click', () => { offset = Math.min(1, offset + 1); render(); });
  $('today').addEventListener('click', () => { offset = 0; render(); });
  $('share').addEventListener('click', async () => {
    const birth = getBirth(); if (!validBirth(birth)) return;
    const f = fortune(birth, ymd(day()));
    const an = animalOf(+birth.slice(0, 4));
    const msg = `${label(day())} ${an.name} 오늘의 운세 ${f.total}점 ${stars(f.stars)}\n${f.text}\n행운의 색 ${f.color.name} · 숫자 ${f.numbers.join(', ')}\n“${f.word}”\n${location.origin}/`;
    try {
      if (navigator.share) await navigator.share({ title: '오늘의 운세', text: msg });
      else { await navigator.clipboard.writeText(msg); toast('결과를 복사했어요'); }
    } catch {}
  });
  let tt = 0;
  function toast(t) { const el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => el.classList.remove('on'), 1800); }

  // 자정이 지나면 새 운세로
  let shown = ymd(new Date());
  setInterval(() => { const now = ymd(new Date()); if (now !== shown) { shown = now; offset = 0; render(); } }, 30000);

  // 반짝이는 밤하늘
  const cv = $('sky'), g = cv.getContext('2d');
  let starsArr = [];
  function size() {
    cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio;
    starsArr = Array.from({ length: Math.round((innerWidth * innerHeight) / 9000) }, () => ({ x: Math.random(), y: Math.random() * 0.8, r: Math.random() * 1.3 + 0.3, p: Math.random() * 6.28 }));
  }
  function sky(t) {
    g.clearRect(0, 0, cv.width, cv.height);
    for (const s of starsArr) {
      const a = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(t / 900 + s.p));
      g.fillStyle = `rgba(255,248,225,${a})`;
      g.beginPath(); g.arc(s.x * cv.width, s.y * cv.height, s.r * devicePixelRatio, 0, 6.29); g.fill();
    }
    if (!matchMedia('(prefers-reduced-motion: reduce)').matches) requestAnimationFrame(sky);
  }
  addEventListener('resize', size); size(); requestAnimationFrame(sky);

  render();
</script>
</body>
</html>
