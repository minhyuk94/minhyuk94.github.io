name: preview
on:
  push:
    branches: [games-section]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci || npm install
      - run: npm run build
      - run: |
          cd dist && git init -q -b preview-build && git add -A
          git -c user.name=ci -c user.email=ci@local commit -qm preview
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" preview-build
